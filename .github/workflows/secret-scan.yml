# Backstop secret scan on the PUBLIC repo (efference). Copybara moves this file into
# place (release/public-overlay/ -> repo root) so the public repo carries its own CI.
# Defense-in-depth: the publish pipeline already scans before pushing; this re-scans
# on every push. Uses the gitleaks BINARY (no license) rather than gitleaks-action,
# which now requires a paid license key on organization repos.
name: secret-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # need history so the proto backstop can read the previous commit
      - name: Install gitleaks
        run: |
          GL=8.24.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan the tree
        run: gitleaks detect --no-git --source . --redact --verbose
      - name: No closed-source calibration source
        # Backstop for the copybara allowlist (which excludes sdk/linux/calibration/**):
        # the public repo must carry only the built calibration .so (sdk/linux/lib/) and
        # the public headers (sdk/linux/include/ef/), never the solver SOURCE. Fail loudly
        # if any of it ever lands here.
        run: |
          hits="$(git ls-files 'sdk/linux/calibration/*' 'sdk/linux/calibration/**/*')"
          if [ -n "$hits" ]; then
            echo "ERROR: closed-source calibration source present in the public repo:"
            echo "$hits"
            exit 1
          fi
          echo "ok: no calibration source in the tree"
      - name: No submodule reference (private calibration repo)
        # The calibration source is a submodule of the PRIVATE repo. A .gitmodules or any
        # gitlink must never reach the public mirror — it would point at (and leak the URL
        # of) the private EfferenceAI/calibration repo and give public users a broken clone.
        # Copybara's allowlist already omits .gitmodules; this is the belt-and-suspenders.
        run: |
          if git ls-files --error-unmatch .gitmodules >/dev/null 2>&1; then
            echo "ERROR: .gitmodules present in the public repo (leaks the private submodule)"; exit 1
          fi
          gitlinks="$(git ls-files -s | awk '$1 == "160000" {print $4}')"
          if [ -n "$gitlinks" ]; then
            echo "ERROR: submodule gitlink(s) present in the public repo:"; echo "$gitlinks"; exit 1
          fi
          echo "ok: no submodule reference in the tree"
      - name: Proto wire-compat backstop (no subtracted / renumbered / reused field tags)
        # Defense-in-depth mirror of the private publish gate: fail if a published
        # proto ever drops or reuses a field/verb number versus the previous release.
        # Each release is one squash commit, so HEAD~1 is the prior public proto; a
        # verb moved to @internal reads as a proper `reserved` retirement (passes).
        run: |
          if ! git rev-parse -q --verify HEAD~1 >/dev/null 2>&1; then
            echo ">> proto-compat: no previous commit - nothing to compare"; exit 0
          fi
          if ! git cat-file -e HEAD~1:proto/ef.proto 2>/dev/null; then
            echo ">> proto-compat: proto/ef.proto absent in previous commit - skipping"; exit 0
          fi
          git show HEAD~1:proto/ef.proto > /tmp/ef.prev.proto
          python3 tools/proto-compat-check.py /tmp/ef.prev.proto proto/ef.proto
