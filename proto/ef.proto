// ef.proto: Efference SDK control protocol (v1)
//
// Single source of truth for the control plane. Generated to:
//   - device: nanopb (static, no malloc), vendored runtime + nanopb_generator
//   - host:   protobuf C++
// Carried as the payload AFTER the 12-byte wire header
//   (magic=0xEF, version, type{1=REQ,2=RESP,3=ERR,4=EVENT-reserved}, flags, corr_id u32, len u32).
//
// Evolution: ADDITIVE ONLY, new field numbers only, never renumber/reuse, `reserved`
// for removals; `protocol_version` (DeviceInformation) negotiates. type=4 EVENT is
// reserved (skip-don't-crash); v1 is strictly request/response (Start* -> poll Get*Status).

syntax = "proto3";
package ef.v1;

// ============================ Envelope ============================
message Request {
  uint32 corr_id = 1;
  oneof body {
    // device / stream core
    GetDeviceInformation get_device_information = 10;
    Configure            configure              = 11;
    StartStream          start_stream           = 12;
    StopStream           stop_stream            = 13;
    SelectTransfer       select_transfer        = 14;
    GetStreamStatus      get_stream_status      = 15;
    SetSetting           set_setting            = 16;
    GetSetting           get_setting            = 17;
    // recording
    StartRecording       start_recording        = 20;
    StopRecording        stop_recording         = 21;
    GetRecordingStatus   get_recording_status   = 22;
    ListRecordings       list_recordings        = 23;
    DeleteRecording      delete_recording       = 24;
    DownloadRecording    download_recording     = 25;  // pull a recorded .mcap to the host over the control plane (USB/BLE, no WiFi)
    // upload
    StartUpload          start_upload           = 30;
    StopUpload           stop_upload            = 31;
    GetUploadStatus      get_upload_status      = 32;
    // chunked upload: the app orchestrates via mTLS, the device is a PUT-worker
    GetSessionManifest   get_session_manifest    = 33;
    PutChunks            put_chunks              = 34;
    GetChunkUploadStatus get_chunk_upload_status = 35;
    // OTA (mirrors the real download/apply phases; wraps the device OTA)
    OtaCheck             ota_check              = 40;
    OtaDownload          ota_download           = 41;
    OtaApply             ota_apply              = 42;
    OtaAbort             ota_abort              = 43;
    GetOtaStatus         get_ota_status         = 44;
    SetOtaConfig         set_ota_config         = 45;
    // OTA push (host -> device relay of a self-contained .eff, for no-WiFi updates)
    OtaPushBegin         ota_push_begin         = 46;  // announce {name,total}; open + storage pre-check
    OtaPushChunk         ota_push_chunk         = 47;  // BLE path: {offset,data<=7KB,eof}
    OtaPushEnd           ota_push_end           = 48;  // USB path: raw bulk-ep stream complete
    // health
    StartHealthCheck     start_health_check     = 50;
    GetHealthStatus      get_health_status      = 51;
    // wifi
    WifiScan             wifi_scan              = 60;
    WifiAdd              wifi_add               = 61;
    WifiRemove           wifi_remove            = 62;
    WifiList             wifi_list              = 63;
    StartWifiCheck       start_wifi_check       = 64;
    GetWifiStatus        get_wifi_status        = 65;
    WifiSelect           wifi_select            = 66;
    // time / system
    SetTime              set_time               = 70;
    TimeSync             time_sync              = 71;
    Heartbeat            heartbeat              = 72;
    Reboot               reboot                 = 73;
    GetStorage           get_storage            = 74;
    GetState             get_state              = 75;
    SetLocation          set_location           = 76;  // store or clear the device location
    GetLocation          get_location           = 77;  // read the stored device location
    // calibration (per-sensor; get is folded into GetDeviceInformation.camera/imu)
    SetCalibration       set_calibration        = 78;  // write intrinsics (IDLE only, next session)
    ResetCalibration     reset_calibration      = 79;  // restore factory default (IDLE only)
    // auth / access control (BLE password is user-facing)
    GetAuthChallenge     get_auth_challenge     = 92;  // device -> nonce (auth handshake, both transports)
    Authenticate         authenticate           = 93;  // prove the control password (HMAC over nonce)
    SetBlePassword       set_ble_password       = 94;  // set or change the control password
    SetUsbLock           set_usb_lock           = 96;  // lock/unlock USB; locked USB gates like BLE
    ForgetBleBonds       forget_ble_bonds       = 106; // drop this device's BLE bonds; each phone must forget it too
    // ADMIN-gated once an administrator password exists, FactoryReset excepted; while
    // none is set they are served at the control-password tier. See AuthRole.
    GetEncryptionKey     get_encryption_key     = 97;  // read the video-encryption key
    FactoryReset         factory_reset          = 98;  // restore factory settings; DESTROYS the encryption key
    SetEncryption        set_encryption         = 99;  // turn at-rest video encryption on/off
    CreateEncryptionKey  create_encryption_key  = 100; // generate a key; returned ONCE
    DeleteEncryptionKey  delete_encryption_key  = 101; // destroy the key (key_id must match)
    SetAdminPassword     set_admin_password     = 103; // provision one, or change it with the current
    ClearAdminPassword   clear_admin_password   = 104; // REMOVE admin; needs the current one
    SetEncryptionKey     set_encryption_key     = 105; // install a key the OPERATOR supplies
  }
  reserved 102;
  reserved 90, 91, 95;
}

message Response {
  uint32    corr_id = 1;
  ErrorCode code    = 2;
  string    message = 3;
  oneof body {
    DeviceInformation device_information = 10;
    StreamStatus      stream_status      = 12;
    SettingValue      setting_value      = 17;
    RecordingStatus   recording_status   = 20;
    RecordingList     recording_list     = 23;
    RecordingChunk    recording_chunk    = 25;  // reply to DownloadRecording (file bytes at offset)
    UploadStatus      upload_status      = 30;
    SessionManifest   session_manifest    = 33;
    ChunkUploadStatus chunk_upload_status = 34;
    OtaStatus         ota_status         = 40;
    HealthStatus      health_status      = 50;
    WifiScanResult    wifi_scan_result   = 60;
    WifiListResult    wifi_list_result   = 63;
    WifiStatus        wifi_status        = 65;
    TimeSyncReply     time_sync_reply    = 71;
    StorageInfo       storage_info       = 74;
    StateInfo         state_info         = 75;
    Location          location           = 76;  // reply to GetLocation
    AuthChallenge     auth_challenge     = 92;  // reply to GetAuthChallenge
    EncryptionKey     encryption_key     = 97;  // reply to Get/Create/Delete/SetEncryptionKey
  }
  reserved 95;
}

// ============================ Errors (shared device<->host; need-basis) ============================
enum ErrorCode {
  SUCCESS                  = 0;
  FAILURE                  = 1;
  NOT_OPENED               = 2;
  INVALID_PARAMETER        = 3;
  CAMERA_UNAVAILABLE       = 4;
  BANDWIDTH_EXCEEDED       = 5;
  UNSUPPORTED              = 6;
  BUSY                     = 7;
  TIMEOUT                  = 8;
  NOT_SUPERSPEED           = 9;
  CORRUPTED_FRAME          = 10;
  DEVICE_SERVICE_UNREACHABLE = 11;
  INVALID_STATE            = 12;
  WIFI_NOT_CONNECTED       = 13;
  NOT_FOUND                = 14;
  STORAGE_FULL             = 15;
  AUTH_REQUIRED            = 16;  // BLE: authenticate before this verb is honored
  AUTH_FAILED              = 17;  // wrong password / bad challenge signature
  ALREADY_EXISTS           = 18;  // name conflict (e.g. start a recording whose name already exists)
  ADMIN_REQUIRED           = 19;  // operator credential is not enough; authenticate with AUTH_ROLE_ADMIN
  // The verb needs the USB link itself; no password satisfies it over BLE. Not the
  // administrator tier, which is transport-independent.
  USB_REQUIRED             = 20;
  // No handler for this verb on this firmware. Distinct from UNSUPPORTED, which
  // means the verb ran and refused the arguments.
  COMMAND_NOT_FOUND        = 21;
}

// ============================ Enums ============================
enum Mode            { MODE_UNKNOWN = 0; ISO_LIVE = 1; BULK_COLLECT = 2; UVC = 3; }
enum Transfer        { TRANSFER_UNKNOWN = 0; ISOC = 1; BULK = 2; }
enum PixelFormat     { PIXFMT_UNKNOWN = 0; NV12 = 1; YUV422 = 2; }
enum Codec           { CODEC_RAW = 0; H264 = 1; H265 = 2; MJPEG = 3; }
enum StreamType      { STREAM_UNKNOWN = 0; VIDEO = 1; IMU = 2; }   // matches packet header `type`
enum Protocol        { PROTO_UNKNOWN = 0; UDP = 1; TCP = 2; }
enum RecordingTarget { REC_HOST_FILE = 0; REC_DEVICE_LOCAL = 1; }  // device-local writes an MCAP on the device
enum UploadDest      { UPLOAD_DEST_UNKNOWN = 0; UPLOAD_CLOUD_URL = 1; UPLOAD_TO_HOST = 2; }
enum UploadMode      { UPLOAD_AFTER_STOP = 0; UPLOAD_STREAMING = 1; }
enum UploadState     { UPLOAD_IDLE = 0; UPLOAD_RUNNING = 1; UPLOAD_DONE = 2; UPLOAD_FAILED = 3; }
enum HealthVerdict   { HV_UNKNOWN = 0; HV_PASS = 1; HV_FAIL = 2; HV_SKIP = 3; }
enum Slot            { SLOT_UNKNOWN = 0; SLOT_A = 1; SLOT_B = 2; }
enum OtaPhase {  // mirrors the device OTA phase codes (1-12)
  OTA_UNKNOWN = 0; OTA_CHECKING = 1; OTA_AVAILABLE = 2; OTA_UPTODATE = 3;
  OTA_DOWNLOADING = 4; OTA_VERIFYING = 5; OTA_READY = 6; OTA_APPLYING = 7;
  OTA_REBOOTING = 8; OTA_SUCCESS = 9; OTA_ROLLEDBACK = 10; OTA_ERROR = 11; OTA_WARN = 12;
}
enum Setting {  // declared-but-stubbed v1
  SETTING_UNKNOWN = 0; EXPOSURE = 1; GAIN = 2; WHITE_BALANCE = 3;
  GAMMA = 4; NOISE_REDUCTION = 5; DISTORTION = 6; RATE_CONTROL = 7;
}
enum RateControl { RC_UNKNOWN = 0; RC_CBR = 1; RC_VBR = 2; RC_FIXQP = 3; }

// ============================ Config ============================
message VideoConfig {
  uint32 width = 1; uint32 height = 2; uint32 fps = 3;   // e.g. 1920x1200x30
  PixelFormat pixel_format = 4;                          // NV12 v1
  Codec codec = 5;                                       // only meaningful in BULK_COLLECT
  uint32 quality = 6;                                    // encoder quality 1-100 (0 = device default); HQ presets use a high value
}
// IMU capture mode: RAW records uncalibrated samples with the calibration as metadata, CALIBRATED applies it on-device, BOTH emits each.
enum ImuData { IMU_RAW = 0; IMU_CALIBRATED = 1; IMU_BOTH = 2; }
message ImuConfig { bool enabled = 1; uint32 rate_hz = 2; uint32 accel_range_g = 3; uint32 gyro_range_dps = 4; ImuData data = 5; }
message Configure { Mode mode = 1; VideoConfig video = 2; ImuConfig imu = 3; }

// ============================ Stream control ============================
message StartStream  { Mode mode = 1; StreamTarget target = 2; }   // LOCAL (default) or ONLINE
message StreamTarget {
  enum Kind { LOCAL = 0; ONLINE = 1; }                             // LOCAL = back to host over USB
  Kind     kind      = 1;
  string   dest_host = 2;                                          // ONLINE: the SDK consumer host
  uint32   dest_port = 3;
  Protocol protocol  = 4;                                          // UDP for ONLINE live
}
message StopStream      {}
message SelectTransfer  { Transfer transfer = 1; }                 // switch the stream transfer mode (ISO<->BULK)
message GetStreamStatus {}
message StreamStatus {
  Mode mode = 1; bool streaming = 2; Transfer transfer = 3; StreamTarget.Kind target = 4;
  uint64 frames = 5; uint64 dropped = 6; uint32 fps_actual = 7; bool superspeed = 8;
}

// ============================ Settings (stubbed v1) ============================
message SetSetting   { Setting setting = 1; double value = 2; }
message GetSetting   { Setting setting = 1; }
message SettingValue { Setting setting = 1; double value = 2; bool supported = 3; }

// ============================ Recording ============================
message StartRecording {
  string name = 1;                          // empty => default "rec_<utc>_<seq>"
  RecordingTarget target = 2;               // REC_HOST_FILE | REC_DEVICE_LOCAL
  UploadSpec upload = 3;                     // optional auto-upload policy
  Location location = 4;                     // optional location for this MCAP only; leaves the stored one alone
}
message StopRecording      { string name = 1; }   // empty => current
message GetRecordingStatus { string name = 1; }
// Why a session stopped; UNSPECIFIED while in progress or from firmware predating the field.
enum StopReason {
  STOP_UNSPECIFIED = 0;
  STOP_USER        = 1;  // explicit stop
  STOP_DISK_FULL   = 2;  // storage reserve reached; finalized cleanly
  STOP_WRITE_ERROR = 3;  // sink write error ended the session
  STOP_INTERRUPTED = 4;  // power loss / crash; recovered at next boot
  STOP_DEVICE      = 5;  // the device ended it, not a user; the file is complete
}

message RecordingStatus {
  string name = 1; bool recording = 2; RecordingTarget target = 3;
  uint64 bytes = 4; uint64 frames = 5; uint64 duration_ms = 6;
  // Whether the stored segments are AES-256-GCM encrypted. Determined by reading
  // the container magic off a segment, not from metadata, so it stays true for
  // files written by an older build and cannot drift from what is on disk.
  bool encrypted = 7;
  StopReason stopped_reason = 8;
  // True when a segment survives only as an unrepaired power-loss torso (an
  // encrypted .partial file salvage cannot rebuild): the bytes download/upload
  // as-is and decrypt with a truncated-tail warning. False from firmware that
  // predates the field.
  bool partial = 9;
}
message ListRecordings  {}
message RecordingList   { repeated RecordingStatus recordings = 1; }
message DeleteRecording { string name = 1; }
// Pull a device-local recording over the control plane: loop offset->EOF, each reply carrying recording bytes, the total size and an eof flag.
message DownloadRecording { string name = 1; uint64 offset = 2; uint32 len = 3; }
message RecordingChunk    { bytes  data = 1; uint64 total = 2; bool   eof = 3; }

// ============================ Upload (device-driven) ============================
message UploadSpec {
  UploadDest dest          = 1;             // CLOUD_URL | TO_HOST
  string     presigned_url = 2;             // when dest = CLOUD_URL
  UploadMode mode          = 3;             // AFTER_STOP | STREAMING
  bool       resumable     = 4;             // presigned_url is a resumable-session URI; omit for a plain PUT
}
message StartUpload     { string recording_name = 1; UploadSpec spec = 2; }
message StopUpload      { string recording_name = 1; }
message GetUploadStatus { string recording_name = 1; }
message UploadStatus {
  string recording_name = 1; UploadState state = 2;
  uint64 bytes_sent = 3; uint64 bytes_total = 4; ErrorCode last_error = 5;
}

// ============================ Chunked upload ============================
// Chunked upload: list a session's chunks, receive pre-signed per-chunk URLs in small batches, PUT them, report the outcome.
message GetSessionManifest { string name = 1; }          // empty => current/last session
message ChunkInfo   { uint32 index = 1; string filename = 2; uint64 size_bytes = 3; }
message SessionManifest { string name = 1; repeated ChunkInfo chunks = 2; }

message ChunkUrl  { uint32 index = 1; string url = 2; }  // one pre-signed PUT URL
message PutChunks { string name = 1; repeated ChunkUrl urls = 2; }  // (re-)PUT these, over WiFi

message ChunkResult          { uint32 index = 1; bool ok = 2; uint64 bytes_put = 3; ErrorCode error = 4; }
message GetChunkUploadStatus { string name = 1; }
message ChunkUploadStatus    { string name = 1; repeated ChunkResult results = 2; bool all_ok = 3; }

// ============================ OTA (thin front-end over the device OTA) ============================
// Thin front-end over the device OTA; commit and rollback are automatic after boot and observable via OtaStatus.
message OtaCheck     {}                      // the host queries the update-check service instead
message OtaDownload  { string base_url = 1; }// required, one-shot; stages to the inactive slot
message OtaApply     {}                      // apply the staged (verified) download, then reboot
message OtaAbort     {}                      // kill a running download (apply = point of no return)
message GetOtaStatus {}
message SetOtaConfig { string base_url = 1;   // reserved: ignored, the URL is per-run
                       uint32 max_retries = 2; bool stage_mode = 3; }
// Relay a self-contained .eff over the wire: USB sends raw bytes on the bulk-OUT push endpoint, BLE sends OtaPushChunk{offset,data,eof}.
message OtaPushBegin { string name = 1; uint64 total_size = 2; }   // total_size => storage pre-check
message OtaPushChunk { uint64 offset = 1; bytes data = 2; bool eof = 3; }  // BLE; data <= ~7 KB
message OtaPushEnd   { bool ok = 1; }                              // USB: raw stream done (false => abort)
message OtaStatus {
  OtaPhase phase               = 1;          // checking..warn (device codes 1-12)
  int32    progress            = 2;          // 0-100, or -1 indeterminate
  string   message             = 3;
  int64    timestamp           = 4;
  string   running_version_str = 5;
  uint32   running_version_int = 6;
  Slot     current_slot        = 7;
  bool     staged              = 8;          // a verified `ready` download waiting to apply
  uint32   target_version_int  = 9;
}

// ============================ Health ============================
// StartHealthCheck{deep} runs the sweep, GetHealthStatus reports it: overall is PASS only if nothing FAILed, and checks[] carries each probe.
message StartHealthCheck { bool deep = 1; }  // deep => ~2 min perf/stress tier
message GetHealthStatus  {}
message HealthCheck { string name = 1; HealthVerdict status = 2; string detail = 3; }  // one probe
message HealthStatus {
  bool          health_passed   = 1;         // inline gate: capture reachable + core presence
  HealthVerdict overall         = 2;         // sweep verdict: PASS only if no FAIL (SKIP ignored)
  bool          sweep_in_flight = 3;
  bool          deep            = 4;
  repeated HealthCheck checks   = 5;         // imu/camera/emmc/wifi/bt/usb/leds/cpu/svc:*/ctl:*/
                                             // emmc_perf/cpu_coherency/mem_bw/thermal... (deep metrics in detail)
  int64         timestamp_ns    = 6;
}

// ============================ WiFi ============================
// AUTO (the default) leaves band choice to the device: strongest AP in range wins.
enum WifiBand { WIFI_BAND_AUTO = 0; WIFI_BAND_2_4_GHZ = 1; WIFI_BAND_5_GHZ = 2; }

message WifiScan {}        message WifiScanResult { repeated WifiNetwork networks = 1; }
// A dual-band AP publishes one SSID per radio, so it appears once per band.
message WifiNetwork { string ssid = 1; int32 rssi = 2; bool secured = 3; int32 freq_mhz = 4; }
message WifiAdd { string ssid = 1; string psk = 2;
                  // country: ISO 3166-1 alpha-2 (e.g. "US"); "" keeps the device regdomain (5 GHz needs it)
                  string country = 3;
                  WifiBand band = 4; }  // AUTO leaves a stored band unchanged; WifiSelect clears it
message WifiRemove { string ssid = 1; }
// prefer a saved network; band is applied as given, so AUTO clears a pin
message WifiSelect { string ssid = 1; WifiBand band = 2; }
message WifiList {}        message WifiListResult { repeated string ssids = 1; }
message StartWifiCheck {}  message GetWifiStatus {}
// Layered: usable is `health == UNSPECIFIED || health >= WIFI_HEALTH_UNVERIFIED` (0 = firmware predates this).
enum WifiHealth { WIFI_HEALTH_UNSPECIFIED = 0; WIFI_HEALTH_DISCONNECTED = 1; WIFI_HEALTH_NO_ADDRESS = 2;
                  WIFI_HEALTH_NO_DNS = 3; WIFI_HEALTH_UNREACHABLE = 4; WIFI_HEALTH_UNVERIFIED = 5;
                  WIFI_HEALTH_OK = 6; }
message WifiStatus { bool connected = 1; string ssid = 2; int32 rssi = 3; string ip = 4;
                     bool internet = 5; double mbps_down = 6; double mbps_up = 7;
                     // Association phase from wpa_state: "connected" / "connecting"
                     // / "disconnected" / "auth_failed" (last connect rejected, e.g.
                     // wrong password).
                     string state = 8;
                     int32  link_speed = 9;    // negotiated PHY link rate, Mbps (0 = unknown)
                     int32  freq_mhz   = 10;   // associated channel frequency, MHz (0 = unknown; host derives 2.4/5 GHz)
                     string security   = 11;   // "WPA2" / "WPA3" / "WPA2/WPA3" / "Open" ("" = unknown)
                     WifiHealth health  = 12;  // whether the link actually works; `connected` is association alone
                   }

// ============================ Time / System ============================
// Whether a Location holds a position. UNSPECIFIED means the sender predates this field and is storing one.
enum LocationState { LOCATION_UNSPECIFIED = 0; LOCATION_SET = 1; LOCATION_NONE = 2; }
// Device location, written into each recording's foxglove.LocationFix; covariance_diag is the position covariance diagonal in m^2. LOCATION_NONE means none is stored and recordings carry none.
message Location    { double latitude = 1; double longitude = 2; double altitude = 3; double covariance_diag = 4; LocationState state = 5; }
message SetLocation { Location location = 1; }   // store a location, or clear it with state=LOCATION_NONE
message GetLocation {}                            // -> Response.location

message SetTime  { uint64 wall_ns = 1; }     // host sets the device wall-clock
message TimeSync { uint64 host_tx_ns = 1; }  // host monotonic at send
message TimeSyncReply { uint64 host_tx_ns = 1; uint64 device_mono_ns = 2; uint64 device_wall_ns = 3; }
message Heartbeat { uint32 timeout_ms = 1; } // miss => device returns to IDLE
message Reboot {}
message GetStorage {}  message StorageInfo { uint64 total_bytes = 1; uint64 free_bytes = 2; uint32 recordings = 3; }
// Current device state, plus whether it is fault-latched in SAFE.
message GetState {}
message StateInfo { string state = 1; string device_state = 2; bool fault_latch = 3; string last_fault = 4; }

// ============================ Device info ============================
message GetDeviceInformation {}
message DeviceInformation {
  string serial = 1; string model = 2; string hw_rev = 3;   // serial: device serial number
  uint32 protocol_version = 4; string firmware_version = 5; bool superspeed = 6;
  CameraIntrinsics camera = 7; ImuCalibration imu = 8;
  uint64 storage_total_bytes = 9;   // userdata (recording) filesystem, total
  uint64 storage_free_bytes  = 10;  // userdata (recording) filesystem, available
  // ---- v1 additive (11+)
  uint32       firmware_version_int   = 11;  // OTA monotonic int (from the version file)
  VideoConfig  current_config         = 12;  // current selected session config (w/h/fps/codec)
  RateControl  rate_control           = 13;  // current encoder rate-control
  float        bitrate                = 14;  // current target bitrate (0 if n/a)
  Capabilities caps                   = 15;  // hardware capability menu
  WifiStatus   wifi                   = 17;  // live WiFi association (ssid/ip)
  bool         must_change_password   = 20;  // BLE password is still the factory default (123456)
  string       wifi_mac               = 21;  // WiFi MAC from vendor storage (item 2), "" if unprovisioned
  string       bt_mac                 = 22;  // BT MAC from vendor storage (item 4), "" if unprovisioned
  bool         usb_locked             = 23;  // USB gates like BLE; host must authenticate before gated verbs
  bool         encryption_enabled     = 24;  // new recordings will be encrypted
  bool         encryption_key_present = 25;  // a key exists; encryption cannot be enabled without one
  string       encryption_key_id      = 26;  // "" when absent; names the key a recording was written under
  EncryptionAlgorithm encryption_algorithm = 27;  // the installed key's cipher (UNSPECIFIED if none)
  // Reported ALONGSIDE usb_locked, which stays true: see SetUsbLock.session_only.
  bool         session_unlocked       = 28;
  // An LE central is connected now; always true when read over BLE.
  bool         ble_connected          = 30;
  // This firmware enforces the ADMIN tier on the encryption-key verbs.
  bool         admin_gate                = 31;
  reserved 29, 32;
  // An administrator password is set; there is no factory default. False means the
  // encryption-key verbs are served at the control-password tier.
  bool         admin_provisioned         = 34;
  // A key exists with no administrator password, so the control password reads it.
  // Do not report such a device as protected. Setting one later protects it too.
  bool         key_unprotected           = 33;
  // The recordings drive is exposed to the host right now; it follows the USB lock.
  bool         recordings_volume_attached = 35;
  // Recordings published on that drive; 0 when it is not attached.
  uint32       recordings_volume_files    = 36;
}
// Hardware capability menu, mirrors device.json (generated from CAPS[]).
message CapMode { uint32 width = 1; uint32 height = 2; uint32 fps = 3; string binning = 4; bool usable = 5; }
message Capabilities {
  repeated string  codecs        = 1;   // "H264" "H265" "RAW"
  repeated string  pixel_formats = 2;   // "NV12"
  repeated string  containers    = 3;   // "MCAP"
  repeated CapMode modes         = 4;   // every advertised width/height/fps/binning (usable flag per row)
}
message CameraIntrinsics {  // Double-Sphere
  double fx = 1; double fy = 2; double cx = 3; double cy = 4; double xi = 5; double alpha = 6;
  uint32 width = 7; uint32 height = 8; repeated double extrinsics_quat = 9;
  bool rectify = 10;   // perform rectification on-device via FEC hardware (default false); intrinsics are always published as metadata regardless
  double fov_scale = 11;  // rectified-output FOV scale (rectify path); default 1.0, <1 widens (more periphery), >1 zooms the clean center
}
message ImuCalibration {
  repeated double accel_bias = 1; repeated double gyro_bias = 2;
  double accel_noise_density = 3; double gyro_noise_density = 4; repeated double imu_to_camera = 5;
  // ---- additive (6+): full per-sensor M*S*(x-b) model, noise model, temporal offset.
  // Empty/zero => that term isn't present (back-compatible with the bias-only base). Recorded
  // uncalibrated + these params travel as metadata; consumer applies M*S*(x-b) downstream.
  repeated double accel_scale_misalign = 6;   // accel 3x3 M*S, row-major (empty = identity)
  repeated double gyro_scale_misalign  = 7;   // gyro  3x3 M*S, row-major (empty = identity; model is bias-only)
  double accel_bias_random_walk = 8;          // Allan +1/2 slope
  double gyro_bias_random_walk  = 9;
  double accel_tau = 10;                       // bias-instability correlation time (Gauss-Markov), s
  double gyro_tau  = 11;
  int64  time_offset_ns = 12;                  // IMU->camera temporal offset (0 when HW-sync only)
}
// Write calibration for one sensor, IDLE only, applied on the next capture session; read it from GetDeviceInformation.
message SetCalibration {
  oneof target { CameraIntrinsics camera = 1; ImuCalibration imu = 2; }
}
// Restore factory-default calibration for the selected sensors, IDLE only; the camera default is uncalibrated.
message ResetCalibration { bool camera = 1; bool imu = 2; }


// ============================ Auth / access control ============================
// The device issues a nonce (GetAuthChallenge); the host proves a password with
// Authenticate{response = HMAC-SHA256(PBKDF2(password, salt, iters), nonce)}. Two
// credentials: OPERATOR (default 123456) and ADMIN, which guards the encryption-key
// verbs. Full model: sdk/linux/README.md, "Access control and at-rest encryption".

// Credential tier for the challenge and the proof; ADMIN grants are single-use and need admin_provisioned.
enum AuthRole {
  AUTH_ROLE_UNSPECIFIED = 0;   // operator: the credential every verb below admin uses
  AUTH_ROLE_ADMIN       = 1;
}
message GetAuthChallenge { AuthRole role = 1; }                        // whose KDF params to serve
message AuthChallenge    { bytes nonce = 1;                            // 32-byte random, single-use
                           bytes salt = 2; uint32 iters = 3; }         // KDF params so host derives the key
message Authenticate     { bytes response = 1;                         // HMAC-SHA256(PBKDF2(pw,salt,iters), nonce)
                           AuthRole role = 2;                          // must match the challenge that issued the nonce
                           uint32 admin_verb = 3; }                    // ADMIN only: the Request tag this grant may be spent on
message SetBlePassword   { string old_password = 1; string new_password = 2; }
// Provision the administrator password with an empty old_password, or change it by supplying the current one.
message SetAdminPassword { string old_password = 1; string new_password = 2; }
// Remove the administrator password so the key verbs fall back to the control password; needs an ADMIN grant and the current value.
message ClearAdminPassword { string current_password = 1; }

// USB access control: locked, a USB session gates like a BLE one, and session_only scopes it to this power session.
message SetUsbLock       { bool locked = 1; bool session_only = 2; }
// Drops the device's side of every BLE pairing; each phone must forget it too.
message ForgetBleBonds   {}
// Which cipher a key is for, and which one a recording was written with.
enum EncryptionAlgorithm {
  ENC_ALG_UNSPECIFIED = 0;   // "device default" on a request; AES_256_GCM in a file
  ENC_ALG_AES_256_GCM = 1;
}

// Enable/disable at-rest encryption for SUBSEQUENT recordings, refused with no key; read the state from DeviceInformation.
message SetEncryption    { bool enabled = 1; EncryptionAlgorithm algorithm = 2; }

// ---- key lifecycle: ADMIN-gated once an administrator password exists ----
// A key is generated by the device (Create, returned ONCE) or supplied by the operator (Set); a factory reset destroys the device's copy.
message GetEncryptionKey    {}
// Refused when a key already exists; rotate with delete then create.
message CreateEncryptionKey { EncryptionAlgorithm algorithm = 1; }   // 0 = device default
// Destroys the key; `key_id` must match the installed one, device must be IDLE, and the reply returns the bytes once.
message DeleteEncryptionKey { string key_id = 1; }
// Install a key the operator already holds. Exactly 32 bytes; refused while one exists.
message SetEncryptionKey    { bytes key = 1; EncryptionAlgorithm algorithm = 2; }
message EncryptionKey {
  EncryptionAlgorithm algorithm = 1;
  bytes  key      = 2;
  string key_id   = 3;   // first 4 bytes of SHA-256(key), hex; names the key in a file header
  bool   present  = 4;   // false on a Delete reply: `key` is what was just destroyed
}

// Restore factory settings. DESTROYS the encryption key, so recordings under it become unreadable; provisioning and factory identity survive.
message FactoryReset     {}

